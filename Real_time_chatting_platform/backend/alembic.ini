# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the URL is a secret and lives in .env,
# which is gitignored. alembic/env.py reads it from core.config.settings, so
# there is exactly one place a connection string is configured.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames, so `ls` shows migration order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
